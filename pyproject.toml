[project]
name = "mistral-managed-queue"
version = "0.2.1"
description = "CLI tool and MCP server for Mistral API with queueing and rate limiting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp[cli]>=1.0.0,<2",
    "mistralai>=1.0.0,<2",
]

[project.optional-dependencies]
catalog = [
    "httpx>=0.25.0",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Include mmq package (core.py is the main entry point), and agent-friendly docs
only-include = [
    "mmq",
    "docs/install.md",
    "docs/usage.md",
    "docs/mcp.md",
    "docs/rate-limit.md",
    "docs/troubleshooting.md",
    "docs/examples.md",
    "docs/README_MCP.md",
    "docs/README_extras_Catalog.md",
]

[tool.hatch.build.targets.sdist]
only-include = [
    "mmq",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "tests",
    "docs/install.md",
    "docs/usage.md",
    "docs/mcp.md",
    "docs/rate-limit.md",
    "docs/troubleshooting.md",
    "docs/examples.md",
    "docs/README_MCP.md",
    "docs/README_extras_Catalog.md",
]

[project.scripts]
mmq = "mmq.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "e2e: end-to-end tests (CLI/MCP subprocess, fake API by default)",
    "live: real Mistral API (requires MISTRAL_API_KEY; costs free-tier quota)",
]

[tool.coverage.run]
source = ["mmq"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
